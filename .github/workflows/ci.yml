name: ci

on:
    push:
        branches:
            - dev
        tags:
            - "[v]?[0-9]+.[0-9]+.[0-9]+*"
    pull_request:

permissions:
    id-token: write
    contents: read
    attestations: write

env:
    CARGO_TERM_COLOR: always
    CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
    build_and_publish_swissbank_image:
        name: publish swissbanks's image
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        env:
            CONTAINER_REGISTRY: ghcr.io
        if: github.ref == 'refs/heads/dev' || (startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '.'))
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Log in to the Container registry
              uses: docker/login-action@v2
              with:
                  registry: ${{ env.CONTAINER_REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels) for Docker image
              id: meta-swissbank
              uses: docker/metadata-action@v4
              with:
                  images: ${{ env.CONTAINER_REGISTRY }}/${{ github.repository }}/swissbank

            - name: Build and push Docker image
              uses: docker/build-push-action@v4
              with:
                  context: swissbank
                  push: true
                  tags: ${{ steps.meta-swissbank.outputs.tags }}
                  labels: ${{ steps.meta-swissbank.outputs.labels }}
