services:
  # Backend service (prover server)
  prover-server:
    build: ./server
    ports:
      - "9816:9816" # WebSocket server port (HTTP)
      - "55688:55688" # wstcp proxy port
    restart: unless-stopped
    container_name: prover-server
    environment:
      - RUST_LOG=info

  # Frontend service (verifier webapp)
  verifier-webapp:
    build: ./webapp
    ports:
      - "8080:80" # HTTP (redirects to HTTPS)
      - "8443:443" # HTTPS
    restart: unless-stopped
    container_name: verifier-webapp
    depends_on:
      - prover-server
    environment:
      - RUST_LOG=info
