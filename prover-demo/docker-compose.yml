services:
  # Backend service (prover server)
  prover-server:
    build: ./server
    ports:
      - "9816:9816" # WebSocket server port (HTTP)
      # - "55688:55688" # no required for demo
    restart: unless-stopped
    container_name: prover-server
    environment:
      - RUST_LOG=info

  # Frontend service (verifier webapp)
  verifier-webapp:
    build:
      context: ./webapp
      args:
        PROVER_PROXY_URL: wss://localhost:8443/prove
    restart: unless-stopped
    container_name: verifier-webapp
    depends_on:
      - prover-server
    environment:
      - RUST_LOG=info

  # Nginx proxy for local testing (HTTPS + WebSocket proxy)
  nginx:
    image: nginx:alpine
    ports:
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-ssl:/etc/nginx/ssl
    depends_on:
      - verifier-webapp
      - prover-server
    restart: unless-stopped
    container_name: prover-nginx
    command: >
      sh -c "apk add --no-cache openssl &&
             mkdir -p /etc/nginx/ssl &&
             if [ ! -f /etc/nginx/ssl/nginx.crt ]; then
               openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /etc/nginx/ssl/nginx.key -out /etc/nginx/ssl/nginx.crt -subj '/C=US/ST=State/L=City/O=Organization/CN=localhost';
             fi &&
             nginx -g 'daemon off;'"

volumes:
  nginx-ssl:
